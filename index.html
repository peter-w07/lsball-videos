<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS Ball Videos</title>
<style>
  :root { --bg: #f6f8f7; --fg: #0d1512; --muted: #4a5a54; --green: #059669; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #070c0a; --fg: #eef5f2; --muted: #9db2aa; --green: #34d399; --card: #0f1814; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { margin: 0 0 24px; color: var(--muted); }
  article { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 24px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  video { width: 100%; border-radius: 10px; background: #000; display: block; }
  a { color: var(--green); word-break: break-all; }
  .link { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>LS Ball</h1>
  <p>Draw videos. Results and tickets at <a href="https://lsball.online">lsball.online</a>.</p>
  <article>
    <h2>Draw 3 · Sunday 8 November · 6 9 4 8 6</h2>
    <video src="draw-3.webm" controls preload="metadata" playsinline></video>
    <div class="link">Direct link: <a href="draw-3.webm">draw-3.webm</a></div>
  </article>
</main>
</body>
</html>
